name: Validate Harness

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-plans:
    name: Validate Plan Structure
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run validate_plans.py
        run: |
          python scripts/validate_plans.py

  test-installer:
    name: Test Installers
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test Python Installer
        run: |
          python install.py --target ./test_project --agent all
          python install.py --target ./test_project --force

      - name: Verify Installed Structure
        shell: bash
        run: |
          test -f ./test_project/AGENTS.md
          test -f ./test_project/docs/WORKFLOW.md
          test -f ./test_project/docs/modules-spec/README.md
          test -f ./test_project/docs/plans/system-roadmap.md
          test -f ./test_project/docs/plans/contract-registry.md
          test -f ./test_project/docs/templates/module-spec-template.md
          test -f ./test_project/docs/templates/ai-skill-maps-template.md
          test -f ./test_project/docs/templates/step-by-step-template.md
          test -f ./test_project/scripts/validate_plans.py
          python ./test_project/scripts/validate_plans.py
          echo "Installation verified successfully on ${{ matrix.os }}!"
